<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniChat</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --side:#f7f7f8; --text:#1f2328; --muted:#6b7280;
  --border:#e5e7eb; --user:#f0f1f3; --accent:#10a37f; --accent-text:#fff; --input:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#212121; --side:#171717; --text:#ececec; --muted:#9ca3af;
    --border:#333; --user:#2f2f2f; --accent:#10a37f; --accent-text:#fff; --input:#2f2f2f;
  }
}
:root[data-theme="dark"]{
  --bg:#212121; --side:#171717; --text:#ececec; --muted:#9ca3af;
  --border:#333; --user:#2f2f2f; --accent:#10a37f; --accent-text:#fff; --input:#2f2f2f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
#side{width:260px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0}
#side h1{font-size:15px;margin:4px 8px 8px;display:flex;align-items:center;gap:8px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
#new{border:1px solid var(--border);background:transparent;border-radius:10px;padding:9px 12px;text-align:left}
#new:hover,.chat-item:hover{background:var(--user)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.chat-item.active{background:var(--user)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
#menu{display:none;border:1px solid var(--border);background:transparent;border-radius:8px;padding:4px 10px}
#top .title{font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:12px}
.row.user{justify-content:flex-end}
.bubble{white-space:pre-wrap;word-wrap:break-word;max-width:100%}
.row.user .bubble{background:var(--user);padding:10px 16px;border-radius:20px;max-width:80%}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
.bubble pre{background:#0d1117;color:#e6edf3;padding:12px 14px;border-radius:10px;overflow-x:auto;white-space:pre;font-size:13.5px;margin:8px 0}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.bubble :not(pre)>code{background:var(--user);padding:1px 5px;border-radius:5px}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:28px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{border:1px solid var(--border);background:transparent;border-radius:14px;padding:8px 14px;font-size:14px}
.chip:hover{background:var(--user)}
#composer{padding:10px 16px 16px}
.box{max-width:740px;margin:0 auto;background:var(--input);border:1px solid var(--border);border-radius:24px;display:flex;align-items:flex-end;padding:6px 6px 6px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;max-height:180px;padding:8px 0;line-height:1.5}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:18px;flex-shrink:0}
#send:disabled{opacity:.35;cursor:default}
.note{max-width:740px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:720px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #side.open{transform:none}
  #menu{display:block}
}
</style>
</head>
<body>
<aside id="side">
  <h1><span class="logo">M</span> MiniChat</h1>
  <button id="new">＋ New chat</button>
  <div id="list"></div>
</aside>
<section id="main">
  <div id="top"><button id="menu" aria-label="Menu">☰</button><span class="title" id="title">New chat</span></div>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <div id="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message MiniChat…"></textarea>
      <button id="send" disabled aria-label="Send">↑</button>
    </div>
    <div class="note" id="note">AI can make mistakes. Check important info.</div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
